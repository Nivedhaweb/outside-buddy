[theme]
base = "light"
primaryColor = "#22B07D"
backgroundColor = "#E4F1FF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18233D"

[server]
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
